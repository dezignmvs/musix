<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Musics</title>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap">
  <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #111111;
      color: #F5F5F5;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background-color: #1A1A1A;
      border: 1px solid #303030;
      border-radius: 12px;
      padding: 40px 32px;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .offline-icon {
      width: 64px;
      height: 64px;
      border-radius: 9999px;
      background: #222222;
      border: 1px solid #303030;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #F87171;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
    }
    p {
      font-size: 14px;
      color: #A3A3A3;
      line-height: 1.6;
    }
    .btn-retry {
      margin-top: 8px;
      padding: 10px 24px;
      background-color: #B8F56A;
      color: #111111;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">
      <i class="hgi-stroke hgi-alert-circle"></i>
    </div>
    <h1>You are currently offline</h1>
    <p>External music streaming requires an internet connection. You can still play your imported local music tracks without connectivity.</p>
    <button class="btn-retry" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
